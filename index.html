<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuruPintar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f6f3;color:#20382d}
header{background:#176b50;color:white;padding:22px}
header h1{margin:0 0 8px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:white}
button{border:0;border-radius:7px;padding:11px 14px;cursor:pointer;margin:3px}
.primary,.active{background:#176b50;color:white}
.secondary{background:#e1eee6;color:#234b39}
.danger{background:#ffe7e4;color:#9c3026}
main{max-width:900px;margin:20px auto;padding:0 14px}
.panel{background:white;border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd8d0;border-radius:7px;font:inherit}
textarea{min-height:75px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid #dce7df;padding:12px;border-radius:8px;margin:12px 0}
.option{display:flex;gap:8px;align-items:start;margin:12px 0}
.option input{width:auto;margin-top:3px}
.option span{flex:1}
.small{font-size:13px;color:#63736a}
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#eaf4ed;padding:13px;border-radius:8px}
.stat strong{display:block;font-size:23px;margin-top:8px}
table{border-collapse:collapse;width:100%;margin-top:15px}
th,td{padding:9px;border:1px solid #d6e0d9;text-align:left}
@media(max-width:550px){.grid,.stats{grid-template-columns:1fr}}
@media print{
 nav,.no-print,header p,footer{display:none!important}
 body{background:white}
 main{margin:0;padding:0}
 .panel{box-shadow:none;padding:4px}
}
</style>
</head>
<body>
<header>
<h1>📚 GuruPintar</h1>
<p>Website pembuat soal, ujian, dan rekap nilai guru.</p>
</header>
<nav class="no-print">
<button class="active" data-page="buat">Buat Soal</button>
<button data-page="ujian">Lembar Ujian</button>
<button data-page="nilai">Rekap Nilai</button>
</nav>

<main>
<section id="buat" class="page">
<div class="panel">
<h2>Pengaturan Ujian</h2>
<div class="grid">
<div><label>Mata pelajaran</label><input id="mapel" placeholder="Contoh: PJOK"></div>
<div><label>Kelas</label>
<select id="kelas">
<option>1</option><option>2</option><option selected>3</option>
<option>4</option><option>5</option><option>6</option>
</select></div>
</div>
<label>Judul ujian</label><input id="judul" placeholder="Contoh: Latihan Bab 1">
</div>

<div class="panel">
<h2>Tambah Soal Pilihan Ganda</h2>
<label>Pertanyaan</label><textarea id="tanya" placeholder="Tulis pertanyaan di sini"></textarea>
<div class="grid">
<div><label>Pilihan A</label><input id="A"></div>
<div><label>Pilihan B</label><input id="B"></div>
<div><label>Pilihan C</label><input id="C"></div>
<div><label>Pilihan D</label><input id="D"></div>
</div>
<label>Kunci jawaban</label>
<select id="kunci"><option>A</option><option>B</option><option>C</option><option>D</option></select>
<p><button class="primary" id="tambah">+ Tambahkan Soal</button></p>
<p id="pesan" class="small"></p>
</div>

<div class="panel">
<h2>Daftar Soal (<span id="jumlah">0</span>)</h2>
<div id="daftar"></div>
<button class="secondary no-print" id="simpan">Simpan Ujian</button>
<button class="danger no-print" id="hapusSemua">Hapus Semua Soal</button>
<p class="small">Data tersimpan di browser perangkat ini.</p>
</div>
</section>

<section id="ujian" class="page hidden">
<div class="panel">
<h2 id="judulLembar">Lembar Ujian</h2><p id="info"></p>
<label>Nama siswa</label><input id="nama" placeholder="Nama lengkap siswa">
<label>Kelas siswa</label><input id="kelasSiswa" placeholder="Contoh: 3A">
</div>
<div class="panel">
<div id="lembar"></div>
<button class="primary no-print" id="kumpul">Kumpulkan & Hitung Nilai</button>
<button class="secondary no-print" id="cetak">Cetak Lembar Ujian</button>
<div id="hasil"></div>
</div>
</section>

<section id="nilai" class="page hidden">
<div class="panel">
<h2>Rekap Nilai Siswa</h2>
<div class="stats">
<div class="stat">Jumlah siswa<strong id="total">0</strong></div>
<div class="stat">Rata-rata<strong id="rata">0</strong></div>
<div class="stat">Nilai tertinggi<strong id="tinggi">0</strong></div>
</div>
<div id="tabel"></div>
<button class="secondary no-print" id="csv">Unduh Rekap CSV</button>
<button class="secondary no-print" id="cetakNilai">Cetak Rekap</button>
<button class="danger no-print" id="hapusNilai">Hapus Rekap Nilai</button>
</div>
</section>
</main>
<footer style="text-align:center;padding:20px" class="small">GuruPintar · Alat bantu guru Indonesia</footer>

<script>
const $ = id => document.getElementById(id);
let soal = [];
let nilai = [];

try {
  soal = JSON.parse(localStorage.getItem("gp_soal") || "[]");
  nilai = JSON.parse(localStorage.getItem("gp_nilai") || "[]");
  if (!Array.isArray(soal)) soal = [];
  if (!Array.isArray(nilai)) nilai = [];
} catch(e) { soal=[]; nilai=[]; }

function aman(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function simpanData() {
  try {
    localStorage.setItem("gp_soal",JSON.stringify(soal));
    localStorage.setItem("gp_nilai",JSON.stringify(nilai));
    return true;
  } catch(e) {
    alert("Gagal menyimpan data di browser.");
    return false;
  }
}
function infoUjian() {
  return {
    mapel:$("mapel").value.trim(),
    kelas:$("kelas").value,
    judul:$("judul").value.trim()
  };
}
function tampilSoal() {
  $("jumlah").textContent=soal.length;
  $("daftar").innerHTML=soal.length ? soal.map((s,i)=>`
    <div class="card">
      <b>${i+1}. ${aman(s.tanya)}</b>
      <p class="small">
      A. ${aman(s.opsi.A)}<br>B. ${aman(s.opsi.B)}<br>
      C. ${aman(s.opsi.C)}<br>D. ${aman(s.opsi.D)}
      </p>
      <p class="small">Kunci: ${aman(s.kunci)}</p>
      <button class="danger no-print" data-hapus="${i}">Hapus soal</button>
    </div>`).join("") : "<p>Belum ada soal.</p>";

  document.querySelectorAll("[data-hapus]").forEach(b=>{
    b.onclick=()=>{
      soal.splice(Number(b.dataset.hapus),1);
      simpanData(); tampilSoal(); tampilUjian();
    };
  });
}
$("tambah").onclick=()=>{
  const tanya=$("tanya").value.trim();
  const opsi={A:$("A").value.trim(),B:$("B").value.trim(),
              C:$("C").value.trim(),D:$("D").value.trim()};
  if(!tanya || Object.values(opsi).some(x=>!x)){
    $("pesan").textContent="Lengkapi pertanyaan dan semua pilihan A–D.";
    return;
  }
  soal.push({tanya,opsi,kunci:$("kunci").value});
  $("tanya").value="";
  ["A","B","C","D"].forEach(x=>$(x).value="");
  $("pesan").textContent="Soal berhasil ditambahkan.";
  simpanData(); tampilSoal(); tampilUjian();
};
$("simpan").onclick=()=>{
  if(simpanData()) alert("Soal tersimpan di browser ini.");
};
$("hapusSemua").onclick=()=>{
  if(confirm("Hapus semua soal?")){
    soal=[]; simpanData(); tampilSoal(); tampilUjian();
  }
};
function tampilUjian(){
  const meta=infoUjian();
  $("judulLembar").textContent=meta.judul||"Lembar Ujian";
  $("info").textContent="Mata pelajaran: "+(meta.mapel||"-")+" | Kelas: "+meta.kelas;
  $("lembar").innerHTML=soal.length ? soal.map((s,i)=>`
    <div class="card">
      <b>${i+1}. ${aman(s.tanya)}</b>
      ${["A","B","C","D"].map(k=>`
        <label class="option">
          <input type="radio" name="jawab${i}" value="${k}">
          <span>${k}. ${aman(s.opsi[k])}</span>
        </label>`).join("")}
    </div>`).join("") : "<p>Belum ada soal. Buat soal terlebih dahulu.</p>";
}
$("kumpul").onclick=()=>{
  if(!soal.length){alert("Buat soal terlebih dahulu.");return;}
  const nama=$("nama").value.trim();
  const kelas=$("kelasSiswa").value.trim();
  if(!nama||!kelas){alert("Isi nama dan kelas siswa.");return;}
  const jawaban=soal.map((s,i)=>{
    const dipilih=document.querySelector('input[name="jawab'+i+'"]:checked');
    return dipilih?dipilih.value:"";
  });
  const benar=soal.reduce((n,s,i)=>n+(jawaban[i]===s.kunci?1:0),0);
  const skor=Math.round(benar/soal.length*100);
  nilai.push({nama,kelas,skor,benar,total:soal.length,tanggal:new Date().toLocaleDateString("id-ID")});
  simpanData();
  $("hasil").innerHTML=`<div class="card"><h3>Hasil pengerjaan</h3>
    <p>Nama: ${aman(nama)}</p><p>Jawaban benar: ${benar} dari ${soal.length}</p>
    <h2>Nilai: ${skor}</h2></div>`;
  tampilNilai();
};
function tampilNilai(){
  $("total").textContent=nilai.length;
  $("rata").textContent=nilai.length?Math.round(nilai.reduce((n,x)=>n+x.skor,0)/nilai.length):0;
  $("tinggi").textContent=nilai.length?Math.max(...nilai.map(x=>x.skor)):0;
  $("tabel").innerHTML=nilai.length?`
    <table><thead><tr><th>Nama</th><th>Kelas</th><th>Nilai</th><th>Tanggal</th></tr></thead>
    <tbody>${nilai.map(x=>`<tr><td>${aman(x.nama)}</td><td>${aman(x.kelas)}</td>
    <td>${x.skor}</td><td>${aman(x.tanggal)}</td></tr>`).join("")}</tbody></table>`
    :"<p>Belum ada nilai siswa.</p>";
}
document.querySelectorAll("[data-page]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
    $(b.dataset.page).classList.remove("hidden");
    document.querySelectorAll("[data-page]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    if(b.dataset.page==="ujian")tampilUjian();
    if(b.dataset.page==="nilai")tampilNilai();
  };
});
$("cetak").onclick=()=>window.print();
$("cetakNilai").onclick=()=>window.print();
$("hapusNilai").onclick=()=>{
  if(confirm("Hapus seluruh rekap nilai?")){
    nilai=[];simpanData();tampilNilai();
  }
};
$("csv").onclick=()=>{
  const rows=[["Nama","Kelas","Nilai","Benar","Jumlah Soal","Tanggal"],
    ...nilai.map(x=>[x.nama,x.kelas,x.skor,x.benar,x.total,x.tanggal])];
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="rekap-nilai-gurupintar.csv";a.click();
  URL.revokeObjectURL(url);
};
tampilSoal();
tampilUjian();
tampilNilai();
</script>
</body>
</html>
