<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Pintar Guru</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #164e63;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 14px 30px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000b;
    }

    h2 { font-size: 20px; margin-top: 0; }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea { min-height: 75px; resize: vertical; }

    .option-row {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    .option-row input[type="radio"] {
      width: 18px;
      height: 18px;
    }

    .option-row label { margin: 0; font-weight: normal; }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px 3px 4px 0;
    }

    .primary { background: #0e7490; color: white; }
    .secondary { background: #e2e8f0; color: #172033; }
    .danger { background: #fee2e2; color: #991b1b; }

    button:focus-visible, input:focus-visible,
    textarea:focus-visible, select:focus-visible {
      outline: 3px solid #67e8f9;
      outline-offset: 2px;
    }

    .question-card {
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 10px;
      margin: 12px 0;
    }

    .question-card h3 { margin-top: 0; }

    .answer-option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin: 8px 0;
      font-weight: normal;
      cursor: pointer;
    }

    .answer-option input {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .answer-option label { margin: 0; font-weight: normal; }

    .muted { color: #64748b; font-size: 14px; }
    .result { line-height: 1.7; }
    .hidden { display: none; }

    @media (max-width: 480px) {
      header h1 { font-size: 24px; }
      .card { padding: 14px; }
      button { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>📚 Kuis Pintar Guru</h1>
  <p>Buat soal, tentukan kunci, dan hitung nilai otomatis.</p>
</header>

<main>
  <section class="card" id="builder">
    <h2>1. Pengaturan kuis</h2>

    <label for="quizTitle">Judul kuis</label>
    <input id="quizTitle" type="text"
      value="Kuis Pengetahuan Umum"
      placeholder="Masukkan judul kuis">

    <label for="schoolLevel">Jenjang pendidikan</label>
    <select id="schoolLevel">
      <option>SD</option>
      <option>SMP</option>
      <option>SMA</option>
      <option>SMK</option>
      <option>Perguruan Tinggi</option>
      <option>Umum</option>
    </select>

    <label for="studentName">Nama siswa (opsional)</label>
    <input id="studentName" type="text"
      placeholder="Nama siswa">

    <p class="muted">
      Buat soal terlebih dahulu, lalu tentukan jawaban yang benar.
    </p>

    <div id="questionEditor"></div>

    <button class="secondary" id="addQuestion">
      + Tambah soal
    </button>
    <button class="primary" id="startQuiz">
      Mulai kuis →
    </button>
  </section>

  <section class="card hidden" id="quizSection">
    <h2 id="quizHeading">Kuis</h2>
    <p class="muted" id="quizInfo"></p>
    <form id="quizForm">
      <div id="quizQuestions"></div>
      <button class="primary" type="submit">
        Kumpulkan jawaban
      </button>
      <button class="secondary" type="button" id="backToEditor">
        Kembali mengedit
      </button>
    </form>
  </section>

  <section class="card hidden" id="resultSection" aria-live="polite">
    <h2>📊 Hasil kuis</h2>
    <div id="resultContent" class="result"></div>
    <button class="primary" id="retryQuiz">Ulangi kuis</button>
    <button class="secondary" id="editQuiz">Edit soal</button>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  let questions = [];
  let quizQuestions = [];
  let lastAnswers = [];

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function addQuestion(data = {}) {
    questions.push({
      id: Date.now() + Math.random(),
      text: data.text || "",
      options: data.options || ["", "", "", ""],
      correct: data.correct ?? 0
    });
    renderEditor();
  }

  function renderEditor() {
    $("questionEditor").innerHTML = questions.map((q, i) => `
      <div class="question-card">
        <h3>Soal ${i + 1}</h3>

        <label for="question-${i}">Pertanyaan</label>
        <textarea id="question-${i}"
          data-question="${i}"
          placeholder="Tulis pertanyaan di sini">${escapeHTML(q.text)}</textarea>

        <p><strong>Pilih kunci jawaban yang benar:</strong></p>

        ${q.options.map((opt, j) => `
          <div class="option-row">
            <input type="radio"
              id="key-${i}-${j}"
              name="key-${i}"
              data-key-question="${i}"
              value="${j}"
              ${q.correct === j ? "checked" : ""}>
            <label for="key-${i}-${j}">
              <strong>${String.fromCharCode(65 + j)}.</strong>
              <input type="text"
                aria-label="Pilihan ${String.fromCharCode(65 + j)} soal ${i + 1}"
                data-option-question="${i}"
                data-option="${j}"
                value="${escapeHTML(opt)}"
                placeholder="Tulis pilihan jawaban"
                style="margin-top:5px">
            </label>
          </div>
        `).join("")}

        <button type="button" class="danger"
          data-delete="${i}">Hapus soal</button>
      </div>
    `).join("");
  }

  $("questionEditor").addEventListener("input", event => {
    const el = event.target;

    if (el.dataset.question !== undefined) {
      questions[Number(el.dataset.question)].text = el.value;
    }

    if (el.dataset.optionQuestion !== undefined) {
      const i = Number(el.dataset.optionQuestion);
      const j = Number(el.dataset.option);
      questions[i].options[j] = el.value;
    }
  });

  $("questionEditor").addEventListener("change", event => {
    const el = event.target;

    if (el.dataset.keyQuestion !== undefined) {
      questions[Number(el.dataset.keyQuestion)].correct =
        Number(el.value);
    }
  });

  $("questionEditor").addEventListener("click", event => {
    const button = event.target.closest("[data-delete]");
    if (!button) return;

    questions.splice(Number(button.dataset.delete), 1);
    renderEditor();
  });

  $("addQuestion").addEventListener("click", () => {
    addQuestion();
    $("questionEditor").lastElementChild.scrollIntoView({
      behavior: "smooth", block: "start"
    });
  });

  function validateQuestions() {
    if (!questions.length) {
      alert("Tambahkan minimal satu soal terlebih dahulu.");
      return false;
    }

    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];

      if (!q.text.trim()) {
        alert(`Pertanyaan nomor ${i + 1} belum diisi.`);
        return false;
      }

      if (q.options.some(opt => !opt.trim())) {
        alert(`Lengkapi semua pilihan jawaban soal ${i + 1}.`);
        return false;
      }
    }

    return true;
  }

  $("startQuiz").addEventListener("click", () => {
    if (!validateQuestions()) return;

    quizQuestions = questions.map(q => ({
      text: q.text,
      options: [...q.options],
      correct: q.correct
    }));

    $("quizHeading").textContent =
      $("quizTitle").value.trim() || "Kuis";
    $("quizInfo").textContent =
      `${$("schoolLevel").value} • ${quizQuestions.length} soal`;

    $("quizQuestions").innerHTML = quizQuestions.map((q, i) => `
      <div class="question-card">
        <h3>${i + 1}. ${escapeHTML(q.text)}</h3>
        ${q.options.map((opt, j) => `
          <label class="answer-option">
            <input type="radio" name="answer-${i}" value="${j}">
            <span>
              <strong>${String.fromCharCode(65 + j)}.</strong>
              ${escapeHTML(opt)}
            </span>
          </label>
        `).join("")}
      </div>
    `).join("");

    $("builder").classList.add("hidden");
    $("resultSection").classList.add("hidden");
    $("quizSection").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("quizForm").addEventListener("submit", event => {
    event.preventDefault();

    lastAnswers = quizQuestions.map((q, i) => {
      const chosen = document.querySelector(
        `input[name="answer-${i}"]:checked`
      );
      return chosen ? Number(chosen.value) : -1;
    });

    const correctCount = quizQuestions.reduce((total, q, i) =>
      total + (lastAnswers[i] === q.correct ? 1 : 0), 0);

    const score = Math.round(
      correctCount / quizQuestions.length * 100
    );

    $("resultContent").innerHTML = `
      <p><strong>Nama:</strong>
        ${escapeHTML($("studentName").value.trim() || "Belum diisi")}</p>
      <p><strong>Judul:</strong>
        ${escapeHTML($("quizTitle").value.trim() || "Kuis")}</p>
      <p><strong>Jenjang:</strong> ${escapeHTML($("schoolLevel").value)}</p>
      <p><strong>Jumlah soal:</strong> ${quizQuestions.length}</p>
      <p><strong>Jawaban benar:</strong> ${correctCount}</p>
      <p><strong>Jawaban salah/kosong:</strong>
        ${quizQuestions.length - correctCount}</p>
      <h2>Nilai: ${score}/100</h2>
      <hr>
      <h3>Pembahasan jawaban</h3>
      ${quizQuestions.map((q, i) => {
        const right = lastAnswers[i] === q.correct;
        return `
          <div class="question-card">
            <p><strong>${i + 1}. ${escapeHTML(q.text)}</strong></p>
            <p>Jawaban siswa:
              ${lastAnswers[i] < 0
                ? "Tidak dijawab"
                : String.fromCharCode(65 + lastAnswers[i]) +
                  ". " + escapeHTML(q.options[lastAnswers[i]])}
            </p>
            <p>Kunci jawaban:
              ${String.fromCharCode(65 + q.correct)}.
              ${escapeHTML(q.options[q.correct])}
            </p>
            <p>${right ? "✅ Benar" : "❌ Salah atau belum dijawab"}</p>
          </div>
        `;
      }).join("")}
    `;

    $("quizSection").classList.add("hidden");
    $("resultSection").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("backToEditor").addEventListener("click", showEditor);
  $("editQuiz").addEventListener("click", showEditor);

  function showEditor() {
    $("quizSection").classList.add("hidden");
    $("resultSection").classList.add("hidden");
    $("builder").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("retryQuiz").addEventListener("click", () => {
    $("resultSection").classList.add("hidden");
    $("quizSection").classList.remove("hidden");
    $("quizForm").reset();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  addQuestion({
    text: "Berapakah hasil dari 5 + 3?",
    options: ["6", "7", "8", "9"],
    correct: 2
  });
</script>

</body>
</html>
